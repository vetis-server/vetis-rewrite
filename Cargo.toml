[package]
name = "vetis-rewrite"
version = "0.1.0-beta.1"
edition = "2024"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/vetis-server/vetis-ws"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server request rewrite support"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "modules", "rewrite", "vetis"]
publish = true
rust-version = "1.86.0"

[lints.cargo]
unused_dependencies = "deny"

[package.metadata.cargo-machete]
ignored = ["cel", "compact_str"]

[features]
default = []

[dependencies]
cel = "0.16.0"
http = "1.5.0"
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
typetag = "0.2.22"
tokio = { version = "1.54.1", optional = true }
vetis = { path = "../vetis/vetis" }
compact_str = "0.10.0"

[dev-dependencies]
caramelo = "0.1.5"
compact_str = { version = "0.10.0", features = ["serde", "smallvec"] }
deboa = { version = "0.1.5" }
deboa-tokio = { version = "0.1.4", default-features = false, features = [
    "http2",
    "rust-tls",
    "default-rustls-provider",
    "default-rustls-verifier",
] }
deboa-ws = { version = "0.1.0" }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros"] }
vetis-flash = { path = "../vetis-flash" }
vetis-tokio = { path = "../vetis-tokio", features = ["rust-tls"] }

# [patch.crates-io]
# vetis = { path = "../vetis/vetis" }
# vetis-flash = { path = "../vetis-flash" }
# vetis-tokio = { path = "../vetis-tokio" }
