worker_threads: 24
max_blocking_threads: 120

server:
  workers: 1
  hosts:
    - hostname: "localhost"
      root_directory: "."
      allow_unsafe_conn: false
      hooks:
        - name: "regex_rewrite"
          target: "/(hello*)/(world*)"
          replacement: "/$2/$1"
        - name: "path_replace"
          matcher: "/app"          
          target: "/app/service"
          replacement: "/api"
        - name: "strip_suffix"
          matcher: "/portal"
          target: "/home"
        - name: "strip_prefix"
          matcher: "/home"
          target: "/home"
      protos:
        - "HTTP/2.0"
      bind_addresses:
        - ["0.0.0.0", 8443]
      tls:
        ca_file: "certs/ca.der"
        cert_file: "certs/server.der"
        key_file: "certs/server.key.der"
        supported_alpns:
          - "h2"
      paths:
        - type: "flash"
          uri: "/"
          response: "Hola VeTiS!"
          status_code: 200
        - type: "flash"
          uri: "/world/hello"
          response: "Hello VeTiS!"
          status_code: 200
        - type: "flash"
          uri: "/api"
          response: "Well done!"
          status_code: 200
        - type: "flash"
          uri: "/portal"
          response: "Welcome to Portal!"
          status_code: 200
        - type: "flash"
          uri: "/service"
          response: "Welcome to Services Portal!"
          status_code: 200
